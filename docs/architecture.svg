<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <style>
      .title{font:700 30px Arial;fill:#0f172a}
      .sub{font:16px Arial;fill:#475569}
      .head{font:700 19px Arial;fill:#0f172a}
      .body{font:15px Arial;fill:#334155}
      .small{font:13px Arial;fill:#475569}
      .box{stroke:#94a3b8;stroke-width:1.5;rx:14}
      .arrow{stroke:#64748b;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="760" fill="#f8fafc"/>
  <text x="600" y="48" text-anchor="middle" class="title">CloudCart | AWS CI/CD Architecture</text>
  <text x="600" y="76" text-anchor="middle" class="sub">Automated container delivery from Git commit to Amazon EKS</text>

  <rect x="55" y="120" width="250" height="110" fill="#dbeafe" class="box"/>
  <text x="180" y="157" text-anchor="middle" class="head">GitHub</text>
  <text x="180" y="184" text-anchor="middle" class="body">Source + Jenkinsfile</text>
  <text x="180" y="207" text-anchor="middle" class="small">Commit / push to main</text>

  <rect x="390" y="120" width="340" height="110" fill="#fef3c7" class="box"/>
  <text x="560" y="157" text-anchor="middle" class="head">Jenkins CI/CD</text>
  <text x="560" y="184" text-anchor="middle" class="body">Checkout · pytest · Docker build</text>
  <text x="560" y="207" text-anchor="middle" class="small">AWS CLI · Docker · kubectl</text>

  <rect x="815" y="120" width="330" height="110" fill="#ffedd5" class="box"/>
  <text x="980" y="157" text-anchor="middle" class="head">Amazon ECR</text>
  <text x="980" y="184" text-anchor="middle" class="body">Private container registry</text>
  <text x="980" y="207" text-anchor="middle" class="small">Immutable Git SHA image tags</text>

  <path d="M305 175 H380" class="arrow"/>
  <path d="M730 175 H805" class="arrow"/>

  <rect x="55" y="315" width="1090" height="385" fill="#eff6ff" class="box"/>
  <text x="85" y="350" class="head">AWS account · ap-south-1</text>

  <rect x="85" y="385" width="300" height="115" fill="#e2e8f0" class="box"/>
  <text x="235" y="420" text-anchor="middle" class="head">Terraform</text>
  <text x="235" y="447" text-anchor="middle" class="body">VPC · Public/private subnets</text>
  <text x="235" y="472" text-anchor="middle" class="body">ECR · EKS · Managed nodes</text>

  <rect x="440" y="385" width="660" height="275" fill="#dcfce7" class="box"/>
  <text x="770" y="420" text-anchor="middle" class="head">Amazon EKS cluster</text>
  <rect x="475" y="450" width="270" height="85" fill="#ffffff" class="box"/>
  <text x="610" y="482" text-anchor="middle" class="head">Deployment</text>
  <text x="610" y="508" text-anchor="middle" class="body">Rolling update · 2 replicas</text>
  <rect x="790" y="450" width="270" height="85" fill="#ffffff" class="box"/>
  <text x="925" y="482" text-anchor="middle" class="head">Kubernetes Service</text>
  <text x="925" y="508" text-anchor="middle" class="body">ClusterIP · Port 80</text>
  <path d="M745 492 H780" class="arrow"/>
  <text x="770" y="580" text-anchor="middle" class="body">Health/readiness probes · CPU/memory limits</text>
  <text x="770" y="608" text-anchor="middle" class="small">Jenkins updates the image and waits for rollout status</text>

  <path d="M980 230 V270 H770 V375" class="arrow"/>
  <path d="M390 175 H350 V270 H235 V375" class="arrow"/>
  <path d="M385 440 H430" class="arrow"/>

  <text x="600" y="733" text-anchor="middle" class="small">Deployment requires configured IAM permissions, ECR repository and EKS access.</text>
</svg>
